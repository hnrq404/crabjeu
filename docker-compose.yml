services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crabjeu
      POSTGRES_USER: crabjeu
      POSTGRES_PASSWORD: crabjeu
    ports:
      - "5432:5432"
    volumes:
      - crabjeu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crabjeu -d crabjeu"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://crabjeu:crabjeu@db:5432/crabjeu
      JWT_SECRET: ${JWT_SECRET:-troque-por-uma-chave-secreta}
    ports:
      - "8000:8000" # usado pelo app nativo (Expo Go)
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./mobile
    ports:
      - "8080:80" # PWA: http://localhost:8080
    depends_on:
      - api

volumes:
  crabjeu_pgdata:
