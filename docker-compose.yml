services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crabjeu
      POSTGRES_USER: crabjeu
      POSTGRES_PASSWORD: crabjeu
    ports:
      - "5432:5432"
    volumes:
      - crabjeu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crabjeu -d crabjeu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crabjeu_pgdata:
